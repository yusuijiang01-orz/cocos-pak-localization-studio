name: vNext Phase 1-8 tests and patch

on:
  push:
    branches:
      - studio-vnext-phase1-core
  pull_request:
    branches:
      - main

jobs:
  vnext-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile vNext backend
        run: |
          python -m py_compile backend/vnext/*.py backend/vnext_cli.py backend/vnext_ui_cli.py backend/vnext_compat_cli.py backend/vnext_phase7_cli.py scripts/build_vnext_patch.py

      - name: Phase 1 tests
        run: python backend/test_vnext_phase1.py

      - name: Phase 2 tests
        run: python backend/test_vnext_phase2.py

      - name: Phase 3 tests
        run: python backend/test_vnext_phase3.py

      - name: Phase 4 tests
        run: python backend/test_vnext_phase4.py

      - name: Phase 5 tests
        run: python backend/test_vnext_phase5.py

      - name: Phase 6 tests
        run: python backend/test_vnext_phase6.py

      - name: Phase 7 synthetic PACK end-to-end
        run: python backend/test_vnext_phase7.py

      - name: Phase 5-8 JavaScript syntax
        run: |
          node --check electron/main_vnext.js
          node --check electron/vnext_ipc.js
          node --check electron/vnext_compat_ipc.js
          node --check electron/preload.js
          node --check renderer/vnext_ui.js
          node --check renderer/vnext_compat_ui.js
          node --check renderer/glossary_translate_ui.js

      - name: Renderer asset wiring
        run: |
          grep -q 'href="vnext.css"' renderer/index.html
          grep -q 'href="vnext_compat.css"' renderer/index.html
          grep -q 'src="vnext_ui.js"' renderer/index.html
          grep -q 'src="vnext_compat_ui.js"' renderer/index.html

  phase7-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Phase 7 PACK end-to-end on Windows
        run: python backend/test_vnext_phase7.py

      - name: Install Electron
        run: npm install --no-audit --no-fund

      - name: Launch production Electron entry and verify vNext renderer
        shell: pwsh
        run: |
          $env:STUDIO_VNEXT_SMOKE = '1'
          $env:ELECTRON_DISABLE_SECURITY_WARNINGS = '1'
          & .\node_modules\.bin\electron.cmd . --disable-gpu
          if ($LASTEXITCODE -ne 0) {
            throw "Electron vNext smoke exited with code $LASTEXITCODE"
          }

      - name: Launch vNext on older baseline without glossary wrappers
        shell: pwsh
        run: |
          Rename-Item .\electron\main_with_glossary_resume.js main_with_glossary_resume.js.bak
          Rename-Item .\electron\main_with_glossary.js main_with_glossary.js.bak
          try {
            $env:STUDIO_VNEXT_SMOKE = '1'
            $env:ELECTRON_DISABLE_SECURITY_WARNINGS = '1'
            & .\node_modules\.bin\electron.cmd . --disable-gpu
            if ($LASTEXITCODE -ne 0) {
              throw "Electron older-baseline fallback smoke exited with code $LASTEXITCODE"
            }
          }
          finally {
            Rename-Item .\electron\main_with_glossary_resume.js.bak main_with_glossary_resume.js
            Rename-Item .\electron\main_with_glossary.js.bak main_with_glossary.js
          }

  phase8-package:
    if: github.event_name == 'push'
    needs: [vnext-tests, phase7-windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout validated branch commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build cumulative runtime overlay patch
        env:
          PATCH_SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build_vnext_patch.py . dist-patch

      - name: Inspect patch contents
        run: |
          unzip -l dist-patch/Cocos-PAK-Studio-vNext-7.0.1-vnext-Incremental-Patch.zip
          cat dist-patch/Cocos-PAK-Studio-vNext-7.0.1-vnext-Incremental-Patch.zip.sha256
          unzip -l dist-patch/Cocos-PAK-Studio-vNext-7.0.1-vnext-Incremental-Patch.zip | grep -q 'electron/main_with_glossary_resume.js'
          unzip -l dist-patch/Cocos-PAK-Studio-vNext-7.0.1-vnext-Incremental-Patch.zip | grep -q 'electron/main_with_glossary.js'
          unzip -l dist-patch/Cocos-PAK-Studio-vNext-7.0.1-vnext-Incremental-Patch.zip | grep -q 'backend/glossary_xlsx_translate_resumable.py'

      - name: Upload cumulative incremental patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cocos-PAK-Studio-vNext-7.0.1-Cumulative-Incremental-Patch
          path: |
            dist-patch/Cocos-PAK-Studio-vNext-7.0.1-vnext-Incremental-Patch.zip
            dist-patch/Cocos-PAK-Studio-vNext-7.0.1-vnext-Incremental-Patch.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
